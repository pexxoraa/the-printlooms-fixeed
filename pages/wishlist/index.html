<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist — The Print Loom</title>

<!-- Base URL for GitHub Pages subfolder deployment -->
<script>
  // Compute the correct <base> dynamically so the site works when served
  // from the domain root (local dev server, custom domain) AND when served
  // from a GitHub Pages *project* subfolder.
  (function () {
    var path = window.location.pathname;
    var base = /^\/theprintloom(\/|$)/.test(path) ? '/theprintloom/' : '/';
    document.write('<base href="' + base + '">');
  })();
</script>

<meta name="description" content="Your saved sarees at The Print Loom.">
<link rel="canonical" href="https://pexxoraa.github.io/the-printlooms-fixeed/pages/wishlist/index.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Root-relative CSS paths (aligns with <base>) -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/utilities.css">
</head>
<body>

<div id="site-header"></div>

<main id="main-content" class="page-main">
  <div class="container">
    <nav class="breadcrumbs"><a id="breadcrumb-home" href="index.html">Home</a> / <span>Wishlist</span></nav>
    <h1>Your Wishlist</h1>
    <p class="text-soft mt-2">Sarees you've saved for later.</p>
    <div id="wishlist-grid" class="grid grid-4 mt-6"></div>
  </div>
</main>

<div id="site-footer"></div>

<script type="module">
  // Script imports updated to root-relative paths
  import { initApp } from './js/app.js';
  import { wishlist } from './js/services/wishlist.js';
  import { mountProductGrid } from './js/components/productCard.js';
  import { CONFIG } from './js/services/config.js';

  async function render() {
    const items = await wishlist.hydrate();
    const grid = document.getElementById('wishlist-grid');
    if (!items.length) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <h3>Your wishlist is empty</h3>
          <p class="mt-2">Tap the heart icon on any saree to save it here.</p>
          <a href="${CONFIG.ROUTES.collections}" class="btn btn-primary mt-5">Browse Collections</a>
        </div>`;
      return;
    }
    mountProductGrid(grid, items);
  }

  window.addEventListener('wishlist:change', render);
  await initApp();

  // Dynamic route binding
  document.getElementById('breadcrumb-home').setAttribute('href', CONFIG.ROUTES.home);

  await render();
</script>

</body>
</html>
