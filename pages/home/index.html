<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Base URL for GitHub Pages subfolder deployment -->
<script>
  // Compute the correct <base> dynamically so the site works when served
  // from the domain root (local dev server, custom domain) AND when served
  // from a GitHub Pages *project* subfolder (username.github.io/theprintlooms/).
  (function () {
    var path = window.location.pathname;
    var base = /^\/theprintlooms(\/|$)/.test(path) ? '/theprintlooms/' : '/';
    document.write('<base href="' + base + '">');
  })();
</script>

<meta http-equiv="refresh" content="0; url=index.html">
<link rel="canonical" href="https://theprintloom.example.com/">
<title>The Print Loom</title>
<script>
  window.location.replace('index.html');
</script>
</head>
<body>
<p>Redirecting to <a href="index.html">home</a>…</p>
</body>
</html>
